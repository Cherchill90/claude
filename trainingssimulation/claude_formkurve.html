<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formkurve Lauftraining</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: Stadion-Anzeigetafel oben, darunter Trainingsbuch (Wochenplan) links und Athletenakte rechts */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#13201B; --muted:#5A6A63; --line:#D3DCD7;
  --tartan:#B4432E; --tartan-soft:#F3DCD5; --infield:#2B6A4D; --infield-soft:#D7EBE0;
  --board:#0F1517; --board-2:#182126; --board-ink:#E9F1EC; --board-dim:#8A9A93; --led:#FFB547;
  --good:#2E8A57; --warn:#C98512; --bad:#C0392B;
  --z1:#9CB9CB; --z2:#4B8DB3; --z3:#DDB13E; --z4:#E07A36; --z5:#C2412D; --z6:#7B3A92;
  --t-run:#B4432E; --t-kraft:#3E5563; --t-sprung:#C98512; --t-koord:#23807A; --t-mob:#7B3A92; --t-alt:#3E78B2;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 4px 14px rgba(19,32,27,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#161F1B; --surface-2:#1B2621; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3631;
    --tartan:#E26A52; --tartan-soft:#3A221C; --infield:#55A980; --infield-soft:#1B3328;
    --board:#080C0D; --board-2:#121A1D;
    --good:#4CB37A; --warn:#E3A33A; --bad:#E5654F;
    --z1:#6F92A8; --z2:#4B9AC9; --z3:#E2BC52; --z4:#EC8A49; --z5:#E2604A; --z6:#A465BD;
    --t-run:#E26A52; --t-kraft:#8DA7B6; --t-sprung:#E3A33A; --t-koord:#3FB2AA; --t-mob:#A465BD; --t-alt:#5C9BDA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1B2621; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3631;
  --tartan:#E26A52; --tartan-soft:#3A221C; --infield:#55A980; --infield-soft:#1B3328;
  --board:#080C0D; --board-2:#121A1D;
  --good:#4CB37A; --warn:#E3A33A; --bad:#E5654F;
  --z1:#6F92A8; --z2:#4B9AC9; --z3:#E2BC52; --z4:#EC8A49; --z5:#E2604A; --z6:#A465BD;
  --t-run:#E26A52; --t-kraft:#8DA7B6; --t-sprung:#E3A33A; --t-koord:#3FB2AA; --t-mob:#A465BD; --t-alt:#5C9BDA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--tartan);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Anzeigetafel ---------- */
.board{background:var(--board);color:var(--board-ink);border-bottom:4px solid var(--tartan)}
.board .wrap{padding-block:14px;display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr);gap:20px;align-items:center}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand-mark{width:38px;height:38px;flex:none}
.brand h1{font-size:26px;letter-spacing:.14em;font-weight:700}
.brand .sub{font-size:13px;color:var(--board-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led-block{text-align:center}
.led-label{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--board-dim)}
.led{font-family:var(--f-mono);font-weight:600;font-size:40px;line-height:1;color:var(--led);letter-spacing:.02em;text-shadow:0 0 18px rgba(255,181,71,.35)}
.led-delta{font-family:var(--f-mono);font-size:13px;margin-top:4px}
.led-delta.good{color:#6FD39A}.led-delta.bad{color:#FF8A73}
.board-right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.bpill{background:var(--board-2);border:1px solid #26333A;border-radius:6px;padding:6px 10px;min-width:92px}
.bpill .k{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim)}
.bpill .v{font-family:var(--f-mono);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.good{background:#4CB37A}.dot.warn{background:#E3A33A}.dot.bad{background:#E5654F}
.board .btn-ghost{color:var(--board-ink);border-color:#2F3D44}
@media (max-width:980px){.board .wrap{grid-template-columns:1fr;text-align:left}.led-block{text-align:left}.board-right{justify-content:flex-start}}

/* ---------- Grundbausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:22px}
.card-b{padding:14px 16px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--tartan);border-color:var(--tartan);color:#fff}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--tartan)}
.btn-big{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:12px 22px;border-radius:8px}
.btn-ghost{background:transparent}
.btn-sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=range]{accent-color:var(--tartan);width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--tartan)}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding-block:18px 40px}
@media (max-width:1180px){.grid-main{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ---------- Setup ---------- */
.setup{padding-block:22px 48px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px}
@media (max-width:1100px){.setup{grid-template-columns:1fr}}
.dist-scale{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.dist{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px;background:var(--surface-2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.dist:hover{border-color:var(--muted)}
.dist[aria-pressed="true"]{border-color:var(--tartan);background:var(--tartan-soft);box-shadow:inset 0 0 0 1px var(--tartan)}
.dist .dl{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.dist .dk{font-size:12px;color:var(--muted)}
.ebar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:auto}
.ebar i{display:block;height:100%}
.e-alac{background:var(--z6)}.e-lac{background:var(--z5)}.e-aer{background:var(--z2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.opt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--infield);background:var(--infield-soft);box-shadow:inset 0 0 0 1px var(--infield)}
.opt b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:13.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.section-t{display:flex;gap:10px;align-items:baseline;margin:6px 0 10px}
.section-t .n{font-family:var(--f-mono);font-size:12px;color:var(--tartan);font-weight:600}
.section-t h3{font-size:20px}

/* ---------- Wochenplan ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.life{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13.5px}
.life label{display:flex;align-items:center;gap:6px}
.life select{padding:3px 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}
.day{border-right:1px solid var(--line);min-height:210px;display:flex;flex-direction:column;min-width:0}
.day:last-child{border-right:0}
.day-h{padding:8px 8px 6px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line)}
.day-h b{font-family:var(--f-display);font-size:17px;letter-spacing:.04em}
.day-h span{font-size:11.5px;color:var(--muted)}
.day.race{background:repeating-linear-gradient(135deg,var(--tartan-soft) 0 8px,transparent 8px 16px)}
.day-b{padding:6px;display:flex;flex-direction:column;gap:6px;flex:1}
.sess{border:1px solid var(--line);border-left:4px solid var(--c,var(--t-run));background:var(--surface);border-radius:6px;padding:6px 7px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px}
.sess:hover{border-color:var(--muted);border-left-color:var(--c)}
.sess .st{font-weight:700;font-size:13px;line-height:1.2}
.sess .sl{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.3}
.sess .zb{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line)}
.sess.fail{border-style:dashed}
.sess .warnline{font-size:11px;color:var(--bad);font-weight:600}
.add{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:5px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-top:auto}
.add:hover{color:var(--ink);border-color:var(--muted)}
.rest{font-size:12px;color:var(--muted);text-align:center;padding:10px 0;font-style:italic}
@media (max-width:820px){.week{grid-template-columns:1fr}.day{border-right:0;border-bottom:1px solid var(--line);min-height:0}.day-b{flex-direction:row;flex-wrap:wrap}.sess{width:auto;flex:1 1 180px}.add{margin-top:0}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.stat{padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-display);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:19px;font-weight:600;line-height:1.2}
.stat .s{font-size:12px;color:var(--muted)}
.zonebar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line)}
.zonebar i{display:block;height:100%}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hints li{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:7px;background:var(--surface-2);border-left:3px solid var(--muted)}
.hints li.warn{border-left-color:var(--warn)}.hints li.bad{border-left-color:var(--bad)}.hints li.good{border-left-color:var(--good)}.hints li.info{border-left-color:var(--t-alt)}
.hints li .tag{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;min-width:58px;padding-top:1px}
.hints li.warn .tag{color:var(--warn)}.hints li.bad .tag{color:var(--bad)}.hints li.good .tag{color:var(--good)}.hints li.info .tag{color:var(--t-alt)}
.reiz{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 56px;gap:6px 10px;align-items:center;font-size:13.5px}
.reiz .rb{position:relative;height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.reiz .rb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.reiz .rb b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.cta-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px}

/* ---------- Athlet ---------- */
.cap-g{margin-top:12px}
.cap-g h4{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cap:last-child{border-bottom:0}
.cap .cn{font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.cap .cv{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.cap .cbar{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.cap .cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--infield);border-radius:3px}
.cap .cbar .st{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.cap .cbar .ce{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dotted var(--tartan)}
.rel{display:inline-flex;gap:2px}
.rel i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.rel i.on{background:var(--tartan)}
.delta{font-family:var(--f-mono);font-size:11.5px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
table.kv td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
table.kv td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.kv tr.hl td{font-weight:700;color:var(--tartan)}
.radar-wrap{display:flex;justify-content:center}
.radar-wrap svg{max-width:300px;width:100%}

/* ---------- Tabs & Charts ---------- */
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;cursor:pointer;font-family:var(--f-display);font-size:16px;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tartan)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.chart-legend span{display:inline-flex;gap:6px;align-items:center}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.log{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto;font-size:13.5px}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.log li .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.log li.bad{color:var(--bad)}.log li.warn{color:var(--warn)}.log li.good{color:var(--good)}
.theory{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.theory article{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px}
.theory h4{font-size:17px;margin-bottom:6px}
.theory p{margin:0 0 6px;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,12,11,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{width:min(1040px,100%);background:var(--surface);border-radius:12px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:24px}
.modal-b{padding:16px 18px}
.modal-f{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
@media (max-width:860px){.ed{grid-template-columns:1fr}}
.typebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.typebtn{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;background:var(--surface-2);padding:6px 10px;cursor:pointer;font-weight:600;font-size:13.5px}
.typebtn[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--c);border-color:var(--c)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.presets .chip{cursor:pointer}
.presets .chip:hover{border-color:var(--muted)}
.norm{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.norm .nl{font-weight:600;font-size:13.5px;line-height:1.2}
.norm .nl small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.norm input[type=number]{width:100%;text-align:right;font-family:var(--f-mono)}
.norm.off{opacity:.38}
.norm .unit{font-size:11.5px;color:var(--muted);grid-column:3;margin-top:-4px;text-align:right}
@media (max-width:520px){.norm{grid-template-columns:1fr 92px}.norm input[type=range]{grid-column:1/-1;grid-row:2}}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:4px 9px;cursor:pointer;font-family:var(--f-display);font-weight:600}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:10px}

<script>
'use strict';
/* =====================================================================
   FORMKURVE – Trainingssimulation Lauf (100 m bis 100 km Ultratrail)
   Modellkern: physiologische Leistungsmodelle + Fitness-Ermüdungs-Modell
   ===================================================================== */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const pl=(x,pts)=>{if(x<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const[a,b]=pts[i-1],[c,d]=pts[i];return b+(d-b)*(x-a)/(c-a);}}return pts[pts.length-1][1];};
const bell=(x,m,w)=>Math.exp(-(((x-m)/w)**2));
const fx=(x,d=1)=>(+x).toFixed(d).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null; // globaler Spielstand

function rand(){ let t=S.rng=(S.rng+0x6D2B79F5)|0; t=Math.imul(t^(t>>>15),1|t); t=(t+Math.imul(t^(t>>>7),61|t))^t; return((t^(t>>>14))>>>0)/4294967296; }
function gauss(){ let u=0,v=0; while(!u)u=rand(); while(!v)v=rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

/* ---------- Distanzen ---------- */
const DIST={
 '100':{label:'100 m',d:100,kind:'sprint',cat:'Sprint',venue:'bahn'},
 '200':{label:'200 m',d:200,kind:'sprint',cat:'Sprint',venue:'bahn'},
 '400':{label:'400 m',d:400,kind:'sprint',cat:'Langsprint',venue:'bahn'},
 '800':{label:'800 m',d:800,kind:'mittel',cat:'Mittelstrecke',venue:'bahn'},
 '1500':{label:'1500 m',d:1500,kind:'mittel',cat:'Mittelstrecke',venue:'bahn'},
 '5000':{label:'5000 m',d:5000,kind:'lang',cat:'Langstrecke',venue:'bahn'},
 '10000':{label:'10 000 m',d:10000,kind:'lang',cat:'Langstrecke',venue:'bahn'},
 'HM':{label:'Halbmarathon',d:21097.5,kind:'lang',cat:'Straße 21,1 km',venue:'strasse'},
 'M':{label:'Marathon',d:42195,kind:'lang',cat:'Straße 42,2 km',venue:'strasse'},
 '50T':{label:'50 km Trail',d:50000,kind:'ultra',cat:'Ultra · Trail',venue:'trail',hm:2200},
 '100T':{label:'100 km Ultratrail',d:100000,kind:'ultra',cat:'Ultra · Trail',venue:'trail',hm:5000}
};
const DKEYS=Object.keys(DIST);
const groupOf=k=>({sprint:'sprint',mittel:'mittel',lang:'lang',ultra:'ultra'})[DIST[k].kind];

/* Anforderungsprofile (Leistungsrelevanz 0–3) */
const REQ={
 '100':{vmax:3,accel:3,maxk:3,coord:2,anae:1,mob:1,hyp:1},
 '200':{vmax:3,anae:2,accel:2,maxk:2,coord:2,mob:1,hyp:1},
 '400':{anae:3,vmax:3,maxk:2,vo2:1,ka:1,coord:1,accel:1},
 '800':{anae:3,vo2:3,vmax:2,lt:1,eco:1,ka:1,maxk:1},
 '1500':{vo2:3,anae:2,lt:2,eco:2,vmax:1,maxk:1},
 '5000':{vo2:3,lt:3,eco:2,anae:1,maxk:1},
 '10000':{lt:3,vo2:3,eco:2,dur:1,maxk:1},
 'HM':{lt:3,vo2:2,eco:2,dur:2,fat:1},
 'M':{lt:3,dur:3,fat:2,eco:2,vo2:2},
 '50T':{dur:3,climb:3,fat:2,ecc:2,lt:2,vo2:2,coord:1,ka:1},
 '100T':{dur:3,fat:3,climb:3,ecc:3,lt:2,ka:2,coord:1,vo2:1,tissue:1}
};

/* ---------- Fähigkeiten (Indexskala 0–100 → reale Einheiten) ---------- */
const GROUPS={aus:'Ausdauer',kraft:'Kraft',schnell:'Schnelligkeit',bew:'Beweglichkeit',koord:'Koordination',bel:'Belastbarkeit'};
const CAPS={
 vo2:{n:'VO₂max',g:'aus',up:35,down:28,u:(i,A)=>fx((30+0.55*i)*A.mass0/massOf(A),1)+' ml/kg/min',d:'Maximale Sauerstoffaufnahme pro kg Körpergewicht.'},
 lt:{n:'Laktatschwelle (IANS)',g:'aus',up:30,down:24,u:i=>Math.round((0.68+0.0028*i)*100)+' % vVO₂max',d:'Anteil der vVO₂max, der ohne Laktatanhäufung gelaufen werden kann.'},
 fat:{n:'Fettstoffwechsel',g:'aus',up:40,down:40,u:i=>fx(0.2+0.008*i,2)+' g/min',d:'Maximale Fettoxidation – schont Glykogen auf langen Strecken.'},
 dur:{n:'Ermüdungswiderstand',g:'aus',up:45,down:40,u:i=>Math.round(i)+' Pkt',d:'Leistung über viele Stunden halten können (Langzeitausdauer).'},
 maxk:{n:'Maximalkraft',g:'kraft',up:35,down:50,u:(i,A)=>Math.round((0.6+0.02*i)*massOf(A))+' kg 1RM',d:'Kniebeuge-1RM. Basis für Schnellkraft und Laufökonomie.'},
 accel:{n:'Schnellkraft',g:'kraft',up:40,down:40,u:i=>fx(22+0.38*i,1)+' cm CMJ',d:'Explosive Kraftentfaltung; prägt Start und Beschleunigung.'},
 ka:{n:'Kraftausdauer',g:'kraft',up:25,down:25,u:i=>Math.round(i)+' Pkt',d:'Ermüdungswiderstand bei wiederholten Krafteinsätzen.'},
 hyp:{n:'Muskelquerschnitt',g:'kraft',up:50,down:60,u:(i,A)=>fx(massOf(A),1)+' kg KG',d:'Hypertrophie erhöht Kraft, aber auch das Körpergewicht.'},
 ecc:{n:'Exzentrische Kraft',g:'kraft',up:30,down:35,u:i=>Math.round(i)+' Pkt',d:'Bremsarbeit der Muskulatur – entscheidend bergab.'},
 climb:{n:'Bergauf-Kraft',g:'kraft',up:35,down:35,u:i=>Math.round(i)+' Pkt',d:'Kraft und Technik für Anstiege und Power-Hiking.'},
 vmax:{n:'Max. Sprintgeschwindigkeit',g:'schnell',up:55,down:50,u:i=>fx(6.6+0.052*i,2)+' m/s',d:'Höchste erreichbare Laufgeschwindigkeit (Aktionsschnelligkeit).'},
 anae:{n:'Schnelligkeitsausdauer',g:'schnell',up:21,down:18,u:i=>Math.round(15+0.45*i)+' ml O₂-Äq.',d:'Anaerobe Kapazität / Laktattoleranz (Stehvermögen).'},
 mob:{n:'Beweglichkeit',g:'bew',up:20,down:25,u:i=>{const v=Math.round(-15+0.4*i);return(v>0?'+':'')+v+' cm Sit & Reach';},d:'Gelenkigkeit und Dehnfähigkeit.'},
 coord:{n:'Technik & Koordination',g:'koord',up:40,down:60,u:i=>Math.round(i)+' Pkt',d:'Lauftechnik, Frequenz, Reaktion, Trittsicherheit im Gelände.'},
 eco:{n:'Laufökonomie',g:'koord',up:80,down:110,u:i=>Math.round(240-0.6*i)+' ml/kg/km',d:'Sauerstoffkosten pro km – niedriger ist besser.'},
 tissue:{n:'Strukturelle Belastbarkeit',g:'bel',up:90,down:60,u:i=>Math.round(i)+' Pkt',d:'Sehnen, Knochen, Bänder. Passt sich langsam an.'}
};
const CK=Object.keys(CAPS);
const massOf=A=>A.mass0+0.1*(A.c.hyp-A.start.hyp);

/* ---------- Abgeleitete Leistungsparameter ---------- */
function derive(A){
 const c=A.c, mass=massOf(A);
 const vo2=(30+0.55*c.vo2)*A.mass0/mass;
 const lt=Math.min(0.95,0.68+0.0028*c.lt);
 const eco=(240-0.6*c.eco)*(1-0.0006*(c.maxk-40))*(1-0.0004*(c.accel-40))*(1-0.0003*(c.coord-50))*(1-0.0001*(c.mob-50));
 const vVO2=vo2/eco*1000/60;
 const vmax=(6.6+0.052*c.vmax)*(1+0.0005*(c.maxk-40)+0.0005*(c.accel-40)+0.0003*(c.coord-50));
 const tauA=Math.max(0.6,(1.55-0.0075*c.accel)*(1-0.0012*(c.maxk-40)));
 const D={A,c,mass,vo2,lt,eco,vVO2,vmax,tauA,tauS:25+45*c.anae/100,Acap:15+0.45*c.anae,react:0.2-0.0006*c.coord,hfmax:Math.round(208-0.7*A.age),cache:{}};
 D.CS=vo2*fAer(40,D)/eco*1000/60;
 return D;
}
function fAer(T,D){
 const c=D.c; let f=T<=6?1:D.lt+(1-D.lt)*Math.exp(-(T-6)/18);
 if(T>60) f*=Math.pow(T/60,-(0.085-0.045*c.dur/100-0.02*c.fat/100));
 if(T>180) f*=Math.pow(T/180,-(0.15-0.08*(c.dur+c.ecc)/200));
 if(T>360) f*=Math.pow(T/360,-(0.16-0.08*(c.dur+c.fat)/200));
 return f;
}
const aerDist=(D,T)=>(D.vo2*fAer(T,D)*T+D.Acap)/D.eco*1000;
function aerTime(D,d){let lo=0.2,hi=6000;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(aerDist(D,m)<d)lo=m;else hi=m;}return(lo+hi)*30;}
function sprintRun(D,d,rec){
 const dt=0.005,vs=D.vVO2*0.95;let t=0,x=0,next=10;const pts=rec?[[0,0]]:null;
 while(x<d&&t<300){t+=dt;const tt=t-D.react;if(tt<=0)continue;
  const v=D.vmax*(1-Math.exp(-tt/D.tauA))*(vs+(D.vmax-vs)*Math.exp(-Math.max(0,tt-3)/D.tauS))/D.vmax;
  x+=v*dt;if(rec&&x>=next){pts.push([next,t]);next+=10;}}
 return rec?{t,pts}:t;
}
function bestTime(D,d){
 const k=Math.round(d);if(D.cache[k])return D.cache[k];let t;
 if(d<=400)t=sprintRun(D,d);else if(d>=800)t=aerTime(D,d);
 else{const w=Math.log(d/400)/Math.log(2),vs=d/sprintRun(D,d),va=d/aerTime(D,d);t=d/(Math.pow(vs,1-w)*Math.pow(va,w));}
 return D.cache[k]=t;
}
const bestSpeed=(D,d)=>d/bestTime(D,d);
function minetti(i){i=clamp(i,-0.45,0.45);return 155.4*i**5-30.4*i**4-43.3*i**3+46.3*i**2+19.5*i+3.6;}
const climbAdj=c=>0.88+0.24*c.climb/100;
const downCap=(c,g)=>(2.6+2.4*c.ecc/100+0.8*c.coord/100)*(1-Math.max(0,Math.abs(g)-0.1)*1.5);

/* ---------- Formatierung ---------- */
function fmtT(sec,dist){
 if(!isFinite(sec))return'–';
 if(dist!==undefined&&dist<=400) return fx(sec,2)+' s';
 if(sec<60) return fx(sec,1)+' s';
 const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(Math.floor(s)).padStart(2,'0');
 if(dist!==undefined&&dist<=1500) return m+':'+(s<10?'0':'')+fx(Math.floor(s*10)/10,1);
 return m+':'+String(Math.round(s)===60?59:Math.round(s)).padStart(2,'0');
}
function fmtPace(v){if(!v||!isFinite(v))return'–';const s=1000/v;let m=Math.floor(s/60),r=Math.round(s%60);if(r===60){m++;r=0;}return m+':'+String(r).padStart(2,'0')+' /km';}
function fmtDur(min){if(min<60)return Math.round(min)+' min';const h=Math.floor(min/60),m=Math.round(min%60);return h+' h '+String(m).padStart(2,'0');}
function fmtDelta(sec,dist){const s=Math.abs(sec);const sign=sec<0?'−':'+';if(dist<=400)return sign+fx(s,2)+' s';if(s<60)return sign+fx(s,1)+' s';return sign+fmtT(s,dist);}
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_L=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const ZONES=['Regeneration','GA1','GA2 / Schwelle','VO₂max','Laktazid','Alaktazid'];
const ZCOL=['var(--z1)','var(--z2)','var(--z3)','var(--z4)','var(--z5)','var(--z6)'];

/* ---------- Einheiten: Voreinstellungen ---------- */
const TYPES={
 run:{n:'Lauf',c:'var(--t-run)'},kraft:{n:'Kraft',c:'var(--t-kraft)'},sprung:{n:'Sprung',c:'var(--t-sprung)'},
 koord:{n:'Koordination',c:'var(--t-koord)'},mob:{n:'Beweglichkeit',c:'var(--t-mob)'},alt:{n:'Alternativ',c:'var(--t-alt)'}
};
const DEF={
 run:{reps:1,sets:1,dist:8000,pct:80,pause:0,setPause:0,hm:0,grade:0,terrain:'strasse',warm:false},
 kraft:{pct:70,reps:10,sets:3,pause:90,ex:4,tempo:'zuegig',focus:'beine'},
 sprung:{contacts:10,sets:4,level:2,pause:90},
 koord:{dur:20,level:2,speed:80},
 mob:{dur:15,method:'statisch',level:2},
 alt:{kind:'rad',dur:60,hf:70}
};
const PRESETS={
 run:[
  ['reg','Regenerationslauf',{dist:6000,pct:68}],
  ['ga1','Lockerer Dauerlauf (GA1)',{dist:10000,pct:80}],
  ['long','Langer Lauf',{dist:20000,pct:82}],
  ['tdl','Tempodauerlauf (GA2)',{dist:6000,pct:92}],
  ['hilly','Hügeliger Dauerlauf',{dist:12000,pct:80,hm:250,terrain:'trail'}],

function evalRun(p,A,fat=1){
 const D=derive(A),c=D.c;
 const reps=Math.max(1,Math.round(p.reps)),sets=Math.max(1,Math.round(p.sets)),d=clamp(+p.dist||100,20,120000),pct=clamp(+p.pct,40,100)/100;
 const n=reps*sets,cont=n===1;
 const vb=bestSpeed(D,d),vE=pct*vb;
 let g=0,vAct=vE,up=0,down=0;
 if(cont&&p.hm>0){g=Math.min(0.35,p.hm/(d/2));const vu=vE*3.6/minetti(g)*climbAdj(c),vd=Math.min(vE*3.6/minetti(-g),downCap(c,g));vAct=d/((d/2)/vu+(d/2)/vd);up=down=+p.hm;}
 else if(!cont&&p.grade>0){g=p.grade/100;vAct=vE*3.6/minetti(g)*climbAdj(c);up=d*g*n;down=up;}
 if(p.terrain==='trail')vAct*=0.93+0.05*c.coord/100;
 const tRep=d/vAct,r=vE/D.vVO2,q=r/D.lt;
 const spF=d<=400?(d>=30?0.98:0.85+0.0065*(d-10)):d>=800?vb/D.vmax:lerp(0.98,vb/D.vmax,(d-400)/400);
 const sv=pct*spF;
 const sprint=sv>0.8&&tRep<16;
 const over=vb>D.CS?Math.max(0,(vE-D.CS)/(vb-D.CS)):0;
 const dep=Math.pow(over,1.8)*Math.min(1,0.3+tRep/80)*fat;
 const tau=(55+220*Math.min(1,tRep/90))*(1.25-0.5*c.vo2/100);
 const st=zeroStim();const zones=[0,0,0,0,0,0];
 let bal=1,done=0,fail=null,qSum=0,load=0,pauseMin=0,minBal=1;
 const zi=sprint?5:r>=1.02?4:q>=1.03?3:q>=0.92?2:q>=0.8?1:0;
 const tMin=tRep/60,kin=cont||p.pause<=1.5*tRep?1:tRep/(tRep+30);
 const df=d<=60?0.8:d<=150?1:d<=300?0.6:0.3;
 outer:for(let si=0;si<sets;si++){for(let ri=0;ri<reps;ri++){
  if(bal-dep<-0.3){fail='Abbruch nach '+done+' von '+n+' Wiederholungen – Pausen zu kurz oder Intensität zu hoch.';break outer;}
  const qb=clamp(bal,0,1);qSum+=qb;
  st.vo2+=tMin*pl(r,VO2P)*kin;st.lt+=tMin*pl(q,LTP);st.fat+=tMin*pl(q,FATP);
  st.eco+=tMin*(0.15+0.35*clamp((r-0.7)/0.5,0,1))+(sv>0.8?0.25*qb:0);
  st.anae+=dep*3*(sprint?0.6:1)+(r>1.02&&!sprint?tMin*0.8:0);
  if(sv>0.85)st.vmax+=Math.pow((sv-0.85)/0.15,1.5)*qb*df;
  if(sv>0.8&&d<=60)st.accel+=((sv-0.8)/0.2)*qb*(1+3*g);
  if(g>0.04&&d<=150&&!cont)st.maxk+=0.12*(1+5*g)*qb;
  if(g>0.03)st.ka+=tMin*g*10;
  if(d>=150&&d<=800&&r>0.95)st.ka+=tMin*0.4;
  if(sprint)st.coord+=0.08;
  load+=tMin*pl(r,RPEP)+dep*10+(sprint?2+4*sv:0);
  zones[zi]+=tMin;bal-=dep;minBal=Math.min(minBal,bal);done++;
  const last=si===sets-1&&ri===reps-1;
  if(!last){const P=ri===reps-1?Math.max(p.setPause||0,p.pause||0):(p.pause||0);bal=1-(1-bal)*Math.exp(-P/tau);pauseMin+=P/60;if(!cont&&p.pause<=1.5*tRep)st.vo2+=(P/60)*pl(r,VO2P)*0.5;}
 }}
 const moveMin=tMin*done,frac=done/n;
 if(cont){const T=moveMin;st.dur+=Math.max(0,T-60)+0.6*Math.max(0,T-120);st.fat+=0.5*Math.max(0,T-75);load+=T*Math.min(2,Math.max(0,(T-60)/80));}
 st.climb+=up*frac/100*(r>0.55?1:0.6);
 st.ecc+=down*frac/100*(cont?1:0.35);
 if(p.terrain==='trail')st.coord+=moveMin*0.04;
 load+=pauseMin*1.5;
 let km=d*done/1000,minutes=moveMin+pauseMin;
 if(p.warm){minutes+=20;const wr=0.62;st.vo2+=20*pl(wr,VO2P);st.fat+=20*pl(wr/D.lt,FATP);st.lt+=20*pl(wr/D.lt,LTP);st.eco+=3;load+=44;km+=20*60*wr*D.vVO2/1000;zones[0]+=20;st.coord+=0.3;}
 const kmQ=d*done/1000;
 const src={vol:km*(p.terrain==='trail'?0.95:p.terrain==='bahn'?1.05:1),sprint:sv>0.7?kmQ*2.2*(sv-0.7)/0.3:0,plyo:0,down:down*frac/1000*3};
 const mech=src.vol+src.sprint+src.down;
 st.tissue+=mech;
 // Methode & Pausenart
 const ratio=(p.pause||0)/tRep;
 let method,pauseKind='';
 if(cont){
  method=q<0.92?'Dauermethode, extensiv':q<1.03?'Dauermethode, intensiv (Tempodauerlauf)':'Wettkampf- / Kontrollmethode';
  if(p.hm>0)method+=' im Gelände';
 }else{
  const full=sprint?(p.pause>=Math.max(90,tRep*8)):ratio>=4;
  pauseKind=full?'vollständige Pause':ratio<1.5&&!sprint?'kurze lohnende Pause':'lohnende Pause';
  if(sprint&&full)method='Wiederholungsmethode (Schnelligkeit)';
  else if(sprint)method='Intensive Intervallmethode (Schnelligkeitsausdauer)';
  else if(full&&pct>=0.88)method='Wiederholungsmethode';
  else if(pct>=0.83||r>=0.97)method='Intensive Intervallmethode';
  else method='Extensive Intervallmethode';
  if(g>0)method+=' am Berg';
 }
 const total=d*n;
 const line=cont?`${fx(d/1000,d%1000?1:0)} km · ${Math.round(pct*100)} %${p.hm>0?' · '+p.hm+' Hm':''}`:`${sets>1?sets+' × ':''}${reps} × ${d>=1000?fx(d/1000,d%1000?1:0)+' km':d+' m'} · ${Math.round(pct*100)} % · P ${fmtPauseS(p.pause)}${g>0?' · '+p.grade+' %':''}`;
 return{type:'run',stim:st,load,mech,src,km,min:minutes,zones,method,pauseKind,energy:energySplit(tRep,over),fail,done,n,line,
  info:{pace:vAct,paceFlat:vE,hr:hrOf(r,D),zone:zi,r,q,tRep,quality:done?qSum/done:0,minBal,total}};
}
function fmtPauseS(s){s=Math.round(s||0);if(s<60)return s+' s';const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')+' min';}

function evalKraft(p,A,fat=1){
 const D=derive(A),c=D.c,pp=clamp(p.pct,20,100)/100,reps=Math.max(1,Math.round(p.reps)),sets=Math.max(1,Math.round(p.sets)),ex=Math.max(1,Math.round(p.ex)),pause=+p.pause||0;
 let repsMax=pp>=0.6?37-36*pp:15.4+(0.6-pp)*120;repsMax=Math.max(1,repsMax/Math.sqrt(fat));
 const effort=Math.min(1.2,reps/repsMax),u=sets*ex;
 const legF={beine:1,ganz:0.7,rumpf:0.25}[p.focus]||1,expl=p.tempo==='explosiv',slow=p.tempo==='langsam';
 let fail=null;if(reps>repsMax*1.08)fail=`Bei ${Math.round(pp*100)} % 1RM sind nur etwa ${Math.floor(repsMax)} Wiederholungen möglich.`;
 const eff=Math.min(1,effort),k=fail?0.5:1;
 const st=zeroStim();
 st.maxk=k*u*Math.pow(clamp((pp-0.55)/0.35,0,1),1.3)*(0.5+0.5*eff)*legF*(pause>=120?1:0.75);
 st.hyp=k*u*bell(reps,10,5)*clamp(eff*1.2-0.3,0,1)*bell(pp,0.75,0.12)*(p.focus==='ganz'?1.2:legF)*(slow?1.15:1)*(pause>=60?1:0.8);
 st.accel=k*u*(expl?(1-Math.max(0,eff-0.5))*(bell(pp,0.45,0.18)+0.6*clamp((pp-0.8)/0.15,0,1)):0.15*clamp((pp-0.7)/0.3,0,1))*legF;
 st.ka=k*u*clamp((reps-10)/20,0,1.5)*(pause<=60?1.2:0.8)*clamp(1-(pp-0.6)/0.3,0,1);
 st.eco=0.25*(st.maxk+st.accel)*legF;
 st.tissue=u*clamp((pp-0.6)/0.3,0,1)*0.15*legF;

 st.climb=0.15*(st.maxk+st.ka)*legF;st.ecc=(slow?0.25:0.1)*st.maxk;
 if(pause<=60&&reps>=15){st.vo2=0.06*u;st.lt=0.05*u;}
 const minutes=u*(reps*(slow?5:expl?1.5:3)+pause)/60+10;
 const rpe=clamp(3+5*Math.max(eff,pp*0.9),2,10);
 const load=rpe*minutes*0.8;
 const mech=u*reps*0.002*legF;
 let method;
 if(pp>=0.85&&reps<=5)method='Maximalkraftmethode (IK-Training)';
 else if(expl&&pp<=0.65)method='Schnellkraftmethode';
 else if(pp>=0.62&&reps>=6&&reps<=15)method='Hypertrophiemethode (Muskelaufbau)';
 else if(reps>=15||pp<0.55)method='Kraftausdauermethode';
 else method='Allgemeines Krafttraining';
 if(p.focus==='rumpf')method+=' · Rumpf';
 const setT=reps*(slow?5:expl?1.5:3);
 return{type:'kraft',stim:st,load,mech,src:{vol:0,sprint:0,plyo:mech,down:0},km:0,min:minutes,zones:[0,0,0,0,0,0],method,energy:energySplit(setT,0.9),fail,done:1,n:1,
  line:`${sets} × ${reps} @ ${Math.round(pp*100)} % · ${ex} Übungen · P ${fmtPauseS(pause)}`,info:{repsMax,effort,rir:Math.max(0,Math.floor(repsMax-reps))}};
}

}

 if(S.ill&&S.day>=S.ill.until){out.events.push({k:'good',t:'Wieder gesund – Training kann fortgesetzt werden.'});S.ill=null;}
 if(S.inj&&S.day>=S.inj.until){out.events.push({k:'good',t:`Verletzung auskuriert (${S.inj.n}).`});S.inj=null;}

 const stim=zeroStim();let mech=0;const src={vol:0,sprint:0,plyo:0,down:0};let sprintExp=0,strengthToday=false;

 for(const s of sess){

/* ---------- Trailstrecke ---------- */
function courseProfile(dist){
 const n=Math.round(dist.d/250),hm=S.setup.hm,alt=[0];
 const ph=[1.3,2.1,4.7,0.6];
 for(let i=1;i<=n;i++){const x=i/n;alt.push(Math.sin(x*Math.PI*2*3+ph[0])*1+Math.sin(x*Math.PI*2*7+ph[1])*0.55+Math.sin(x*Math.PI*2*15+ph[2])*0.25+Math.sin(x*Math.PI*2*1+ph[3])*0.6);}
 const off=alt[0];for(let i=0;i<alt.length;i++)alt[i]-=off+(alt[n]-off)*i/n;
 let asc=0;for(let i=1;i<alt.length;i++)asc+=Math.max(0,alt[i]-alt[i-1]);
 const k=hm>0?hm/asc:0,sc=alt.map(a=>a*k),mn=Math.min(...sc);return sc.map(a=>a-mn+420);
}
function trailRace(D,dist,o){
 const c=D.c,alt=courseProfile(dist),n=alt.length-1,seg=dist.d/n,tech=0.93+0.05*c.coord/100;
 let T=dist.d/(D.vVO2*0.7);
 const runOnce=(T,record)=>{
  const vf=(D.vo2*fAer(T/60,D)+D.Acap/(T/60))/D.eco*1000/60*o.speedMul;
  let t=0,cum=0;const pts=record?[[0,0]]:null;
  for(let i=0;i<n;i++){
   const g=(alt[i+1]-alt[i])/seg;let v;
   const x=i/n,pace=o.pacing==='fast'?(x<0.25?1.05:1-0.05*(x-0.25)/0.75*1.6):o.pacing==='neg'?(x<0.5?0.985:1.012):1;
   if(g>0.02)v=vf*3.6/minetti(g)*climbAdj(c);
   else if(g<-0.02){cum+=-g*seg;const dmg=1-Math.min(0.35,cum/1000*0.04*(1.2-c.ecc/100));v=Math.min(vf*3.6/minetti(g),downCap(c,g)*dmg);}
   else v=vf;
   v*=tech*pace;if(o.bonkAt&&t>o.bonkAt)v*=0.8;
   t+=seg/v;if(record)pts.push([(i+1)*seg,t]);
  }
  return record?{t,pts}:t;
 };
 for(let i=0;i<30;i++)T=runOnce(T,false);
 const r=runOnce(T,true);
 return{time:r.t,pts:r.pts,alt};
}

  const speedMul=form*rnd/(1+heat);
  if(heat>0.01)ev.push({k:'warn',t:`${temp} °C am Start – Hitze kostet etwa ${fx(heat*100,1)} % Tempo.`});
  if(dist.kind==='ultra'){
   let r=trailRace(D,dist,{speedMul:speedMul/pace,pacing:opt.pacing,kh:opt.kh});
   const bonk=bonkTime(D,r.time,d,opt);
   if(bonk.at<r.time){r=trailRace(D,dist,{speedMul:speedMul/pace,pacing:opt.pacing,kh:opt.kh,bonkAt:bonk.at});ev.push({k:'bad',t:`Hungerast nach ${fmtT(bonk.at)} – Glykogenspeicher leer, Tempo bricht ein.`});}
   time=r.time;pts=r.pts;alt=r.alt;
   if(bonk.gi){time*=1.05;pts=pts.map(([x,t])=>[x,t*1.05]);ev.push({k:'warn',t:'Magen-Darm-Probleme durch sehr hohe Kohlenhydratzufuhr.'});}
  }else{
   T=T*pace/speedMul;
   const bonk=T>75*60?bonkTime(D,T,d,opt):{at:Infinity};
   pts=[[0,0]];let t=0;const N=200,seg=d/N,v0=d/T;let bonked=false;
   for(let i=0;i<N;i++){const x=i/N;let m=opt.pacing==='fast'?(x<0.3?1.035:1-0.035*0.3/0.7*1.25):opt.pacing==='neg'?(x<0.5?0.99:1.01):1;
    if(t>bonk.at){m*=0.8;bonked=true;}t+=seg/(v0*m);pts.push([(i+1)*seg,t]);}
   time=t;
   if(bonked)ev.push({k:'bad',t:`Hungerast bei km ${fx(distAt(pts,bonk.at)/1000,1)} – der „Mann mit dem Hammer“.`});
   if(bonk.gi){time*=1.03;pts=pts.map(([x,tt])=>[x,tt*1.03]);ev.push({k:'warn',t:'Magen-Darm-Probleme durch sehr hohe Kohlenhydratzufuhr.'});}
  }
 }
 if(tsb<-20)ev.push({k:'warn',t:`Ermüdet an den Start gegangen (Form ${Math.round(tsb)} %) – das kostet Zeit.`});
 else if(tsb>45)ev.push({k:'info',t:`Sehr lange Entlastung (Form +${Math.round(tsb)} %) – etwas Wettkampfschärfe verloren.`});
 else if(tsb>0)ev.push({k:'good',t:`Gut erholt an den Start gegangen (Form +${Math.round(tsb)} %).`});
 return{time,pts,alt,temp,ev,base,form,tsb};
}
function distAt(pts,t){for(let i=1;i<pts.length;i++)if(pts[i][1]>=t){const[a,b]=pts[i-1],[c,d]=pts[i];return a+(c-a)*(t-b)/(d-b);}return pts[pts.length-1][0];}
function timeAt(pts,x){for(let i=1;i<pts.length;i++)if(pts[i][0]>=x){const[a,b]=pts[i-1],[c,d]=pts[i];return b+(d-b)*(x-a)/(c-a);}return pts[pts.length-1][1];}
function bonkTime(D,T,d,opt){
 const v=d/T,r=v/D.vVO2;
 const rate=Math.max(20,(r-0.35)*420*(1.3-0.6*D.c.fat/100));
 const G=450*(opt.carbo?1.2:1);
 const net=rate-opt.kh;
 const at=net<=0?Infinity:G/net*3600;
 const gi=opt.kh>75&&S.setup.random&&rand()<(opt.kh-75)/60;
 return{at,gi,rate};
}

function newGame(setup){
 S={setup,rng:(setup.seed>>>0)||12345,phase:'plan',day:0,week:0,life:{sleep:8,food:3,stress:1},ATL:0,CTL:0,D:1,ill:null,inj:null,loads:[],injDays:0,illDays:0,
  hist:{daily:[],weeks:[],log:[],plans:[]},tab:'last',race:null};
 S.A=createAthlete(setup);
 S.ATL=S.CTL=S.A.hLoad;for(let i=0;i<7;i++)S.loads.push(S.A.hLoad);
 S.startPred=predict(S.A);
 S.startCaps=Object.assign({},S.A.c);
 S.plan=buildTemplate(groupOf(setup.distKey),phaseFor(0,setup.weeks),setup.level,setup.distKey);
 S.hist.log.push({day:0,k:'info',t:`Saisonstart: Ziel ${DIST[setup.distKey].label} in ${setup.weeks} Wochen. Startprognose ${fmtT(S.startPred,DIST[setup.distKey].d)}.`});
 S.hist.weeks.push(weekSnapshot(-1));
}
function weekSnapshot(w,extra){
 const A=S.A,g={};
 for(const k of Object.keys(GROUPS))g[k]=groupScore(A,k);
 return Object.assign({week:w,pred:predict(A),groups:g,caps:Object.assign({},A.c),ctl:S.CTL,atl:S.ATL},extra||{});
}
function groupScore(A,g){const ks=CK.filter(k=>CAPS[k].g===g);return ks.reduce((a,k)=>a+A.c[k],0)/ks.length;}
function simulateWeek(){
 const capsBefore=Object.assign({},S.A.c),predBefore=predict(S.A);
 const days=[];const last=S.week===S.setup.weeks-1;
 for(let i=0;i<(last?6:7);i++)days.push(simulateDay());
 const sum={load:0,km:0,min:0,zones:[0,0,0,0,0,0],sessions:0,fails:0,skipped:0,strength:0,rest:0};
 for(const d of days){sum.load+=d.load;sum.km+=d.km;sum.min+=d.min;d.zones.forEach((z,i)=>sum.zones[i]+=z);
  let any=false;for(const it of d.items){if(it.skip)sum.skipped++;else{sum.sessions++;any=true;if(it.e.fail)sum.fails++;if(it.s.type==='kraft')sum.strength++;}}if(!any)sum.rest++;}
 const snap=weekSnapshot(S.week,{load:sum.load,km:sum.km,min:sum.min,zones:sum.zones,sessions:sum.sessions,fails:sum.fails,skipped:sum.skipped,strength:sum.strength,rest:sum.rest,acwr:S.ATL/Math.max(1,S.CTL),tsb:formRel(),capsBefore,predBefore});
 S.hist.weeks.push(snap);
 S.hist.plans.push(JSON.parse(JSON.stringify(S.plan)));
 const rep={week:S.week,days,sum,snap};
 if(last){S.phase='race';}
 else{S.week++;}
 return rep;
}

/* ---------- Wochenanalyse (Planung) ---------- */
function analyzePlan(){
 const A=S.A,dist=DIST[S.setup.distKey];
 const r={load:0,km:0,min:0,zones:[0,0,0,0,0,0],stim:zeroStim(),evals:[],hard:[0,0,0,0,0,0,0],runs:0,strength:0,count:0,days:new Set(),fails:[]};
 const last=S.week===S.setup.weeks-1;
 for(const s of S.plan){
  if(last&&s.day===6)continue;
  const e=evalSession(s,A,1);r.evals.push([s,e]);r.count++;r.days.add(s.day);
  r.load+=e.load;r.km+=e.km;r.min+=e.min;e.zones.forEach((z,i)=>r.zones[i]+=z);
  for(const k of CK)r.stim[k]+=e.stim[k];
  if(s.type==='run')r.runs++;if(s.type==='kraft')r.strength++;
  if(e.zones[3]+e.zones[4]+e.zones[5]>4||e.load>480||(s.type==='kraft'&&s.p.pct>=80)||(s.type==='sprung'&&s.p.level===3))r.hard[s.day]++;
  if(e.fail)r.fails.push([s,e]);
 }
 const hints=[];
 const wkRatio=r.load/(S.CTL*7);
 if(wkRatio>1.45)hints.push(['bad','Risiko',`Geplante Belastung ${Math.round(r.load)} AU liegt ${Math.round((wkRatio-1)*100)} % über dem chronischen Niveau – starker Belastungssprung, Verletzungsrisiko steigt deutlich.`]);
 else if(wkRatio>1.2)hints.push(['warn','Steigerung',`Belastung +${Math.round((wkRatio-1)*100)} % gegenüber dem Trainingszustand. Mehr als 10–20 % pro Woche erhöht das Risiko.`]);
 else if(wkRatio<0.6&&!last)hints.push(['info','Entlastung',`Belastung nur ${Math.round(wkRatio*100)} % des Gewohnten – gut als Entlastungswoche, dauerhaft droht Leistungsrückgang.`]);
 const rest=7-r.days.size-(last?0:0);
 if(r.days.size>=7)hints.push(['warn','Erholung','Kein Ruhetag geplant. Superkompensation braucht Phasen ohne Belastung.']);
 for(let i=0;i<6;i++)if(r.hard[i]&&r.hard[i+1])hints.push(['warn','Abfolge',`${DAYS_L[i]} und ${DAYS_L[i+1]} sind beide intensiv – zwischen harten Reizen 48 h Erholung einplanen.`]);
 const zt=r.zones.reduce((a,b)=>a+b,0)||1;
 if(['lang','ultra'].includes(dist.kind)||dist.d>=1500){
  const low=(r.zones[0]+r.zones[1])/zt,mid=r.zones[2]/zt;
  if(mid>0.3)hints.push(['warn','Intensität',`${Math.round(mid*100)} % der Laufzeit im Schwellenbereich – viel „Grauzone“. Ausdauerspitzen trainieren meist ~80 % locker, ~20 % intensiv.`]);
  else if(low>0.95&&r.runs>=3)hints.push(['info','Intensität','Fast ausschließlich lockere Umfänge – für Leistungssteigerung fehlen intensive Reize.']);
 }
 if(r.strength===0)hints.push(['info','Kraft','Kein Krafttraining geplant. Kraft verbessert Laufökonomie und schützt vor Verletzungen.']);
 const req=REQ[S.setup.distKey];
 const tops=Object.entries(req).sort((a,b)=>b[1]-a[1]).slice(0,4);
 const cover=tops.map(([k,w])=>({k,w,ratio:(r.stim[k]/7)/Math.max(1e-6,A.M[k])}));
 for(const cv of cover)if(cv.w>=3&&cv.ratio<0.75)hints.push(['warn','Spezifität',`${CAPS[cv.k].n} ist für ${dist.label} entscheidend, bekommt aber nur ${Math.round(cv.ratio*100)} % des Reizes, der das aktuelle Niveau hält.`]);
 for(const[s,e]of r.fails)hints.push(['bad','Machbar?',`${DAYS[s.day]} · ${s.name}: ${e.fail}`]);
 if(last){const prev=S.hist.weeks.slice(-3).filter(w=>w.load).map(w=>w.load);const avg=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:S.CTL*7;const tr=r.load/avg;
  hints.push(tr>0.8?['warn','Tapering',`Wettkampfwoche mit ${Math.round(tr*100)} % der letzten Wochen – reduziere den Umfang auf etwa 40–60 % bei erhaltener Intensität.`]:tr<0.3?['info','Tapering','Sehr starke Reduktion – Schärfe kann verloren gehen. Kurze intensive Reize beibehalten.']:['good','Tapering',`Umfang auf ${Math.round(tr*100)} % reduziert – gute Voraussetzung für die Formspitze.`]);}
 if(S.inj)hints.unshift(['bad','Verletzt',`${S.inj.n}: noch ${S.inj.until-S.day} Tage. Lauf- und Sprungeinheiten fallen aus.`]);
 if(S.ill)hints.unshift(['bad','Krank',`Infekt: noch ${S.ill.until-S.day} Tage Pause.`]);
 if(!hints.length)hints.push(['good','Plan','Keine Auffälligkeiten – Belastung und Erholung wirken ausgewogen.']);
 r.hints=hints;r.cover=cover;r.wkRatio=wkRatio;r.restDays=7-r.days.size;
 return r;
}

function theoryHTML(){
 const items=[
  ['Belastungsnormative','Intensität (wie stark), Reizdauer (wie lange ein Reiz), Reizdichte (Verhältnis Belastung zu Pause), Reizumfang (Summe aller Reize einer Einheit) und Trainingshäufigkeit (Einheiten pro Woche). In jeder Einheit lassen sich alle fünf einstellen.'],
  ['Intensität in % der Bestleistung','Die Intensität bezieht sich auf die aktuelle Bestleistung über genau die Reizstrecke. 90 % über 400 m sind deshalb viel schneller als 90 % über 10 km. Tempo und Herzfrequenz rechnet die Simulation daraus aus.'],
  ['Trainingsmethoden','Dauermethode: ohne Pause. Extensive Intervallmethode: mittlere Intensität, kurze „lohnende“ Pausen. Intensive Intervallmethode: hohe Intensität, längere lohnende Pausen. Wiederholungsmethode: sehr hohe Intensität mit vollständiger Erholung. Wettkampfmethode: einmalige Maximalbelastung.'],
  ['Superkompensation & Anpassung','Jede Fähigkeit passt sich an den durchschnittlichen Reiz der letzten Wochen an. Mit wachsendem Niveau sind immer größere Reize nötig (Prinzip der progressiven Belastungssteigerung). Ohne Reiz bildet sich die Fähigkeit zurück (Reversibilität).'],
  ['Fitness, Ermüdung, Form','Fitness (CTL) ist der Mittelwert der Belastung über 42 Tage, Ermüdung (ATL) über 7 Tage. Form = Fitness − Ermüdung. Vor dem Wettkampf wird der Umfang reduziert (Tapering), damit die Ermüdung schneller sinkt als die Fitness.'],
  ['Belastung in AU','Session-RPE: subjektive Anstrengung (0–10) × Dauer in Minuten. Kurze Sprints, Sprünge und schwere Kraftserien werden zusätzlich als neuromuskuläre Belastung bewertet.'],
  ['Verletzungsrisiko (ACWR)','Das Verhältnis von akuter zu chronischer Belastung. Werte zwischen 0,8 und 1,3 gelten als günstig, über 1,5 steigt das Verletzungsrisiko deutlich. Sehnen und Knochen passen sich langsamer an als Herz und Muskulatur.'],
  ['Energiebereitstellung','Anaerob-alaktazid (ATP, Kreatinphosphat; bis ~10 s), anaerob-laktazid (Glykolyse; ~10 s bis 2 min), aerob (Glykogen- und Fettoxidation; ab ~2 min dominierend). Die Pausenlänge bestimmt, welches System trainiert wird.'],
  ['Kraftmethoden','Maximalkraft (IK): 85–100 % 1RM, 1–5 Wdh., lange Pausen. Hypertrophie: 65–85 %, 6–12 Wdh. bis nahe Ausbelastung. Schnellkraft: 30–60 %, explosiv, wenige Wdh. Kraftausdauer: unter 60 %, 15–30 Wdh., kurze Pausen.'],
  ['Spezifität','Trainiert wird, was belastet wird. Sprinter brauchen vollständige Pausen für Schnelligkeit, Ultraläufer Höhenmeter und lange Läufe, Mittelstreckler beides. Die Reizbilanz zeigt, ob die entscheidenden Fähigkeiten genug Reize bekommen.']
 ];
 return`<div class="theory">${items.map(([h,p])=>`<article><h4>${h}</h4><p>${p}</p></article>`).join('')}</div>`;
}

/* ---------- Diagramme (SVG) ---------- */
function niceTicks(a,b,n=5){const span=b-a||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||step0;const out=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st)out.push(+v.toFixed(10));return out;}
function lineChart(o){
 const W=720,H=o.h||220,pl_=58,pr=12,pt=12,pb=26;
 let ys=[];for(const s of o.series)for(const p of s.data)ys.push(p[1]);if(o.bars)for(const b of o.bars)ys.push(b[1]);
 let yMin=o.yMin!==undefined?o.yMin:Math.min(...ys),yMax=o.yMax!==undefined?o.yMax:Math.max(...ys);
 if(o.zero){yMin=Math.min(yMin,0);yMax=Math.max(yMax,0);}
 if(yMax-yMin<1e-6){yMax+=1;yMin-=1;}
 const pad=(yMax-yMin)*0.06;if(o.yMin===undefined)yMin-=pad;if(o.yMax===undefined)yMax+=pad;
 const X=x=>pl_+(x-o.xMin)/(o.xMax-o.xMin||1)*(W-pl_-pr);
 const Y=y=>o.invert?pt+(y-yMin)/(yMax-yMin)*(H-pt-pb):H-pb-(y-yMin)/(yMax-yMin)*(H-pt-pb);
 const yt=niceTicks(yMin,yMax,4),xt=niceTicks(o.xMin,o.xMax,Math.min(8,o.xMax-o.xMin||1)).filter(v=>Number.isInteger(v));
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
 s+=`<g class="grid">${yt.map(v=>`<line x1="${pl_}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>`;
 s+=yt.map(v=>`<text x="${pl_-6}" y="${Y(v)+3.5}" text-anchor="end">${o.yFmt?o.yFmt(v):v}</text>`).join('');
 s+=xt.map(v=>`<text x="${X(v)}" y="${H-8}" text-anchor="middle">${o.xFmt?o.xFmt(v):v}</text>`).join('');
 if(o.zero&&yMin<0)s+=`<line x1="${pl_}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
 if(o.bars){const bw=Math.max(1.5,(W-pl_-pr)/((o.xMax-o.xMin)+1)*0.7);s+=o.bars.map(([x,y,c])=>`<rect x="${X(x)-bw/2}" y="${Y(Math.max(0,y))}" width="${bw}" height="${Math.max(0,Y(0)-Y(Math.max(0,y)))}" fill="${c||'var(--z2)'}" rx="1"/>`).join('');}
 for(const se of o.series){if(!se.data.length)continue;const d=se.data.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  if(se.dots)s+=se.data.map((p,i)=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${i===se.data.length-1?4.5:2.6}" fill="${se.color}"/>`).join('');
  else{const p=se.data[se.data.length-1];s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="${se.color}"/>`;}}
 if(o.label)s+=`<text x="${pl_+4}" y="${pt+8}">${o.label}</text>`;
 return s+'</svg>';
}
function radarSVG(vals,start,labels,req){
 const n=vals.length,cx=150,cy=135,R=95,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
 const poly=(arr)=>arr.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
 let s=`<svg viewBox="0 0 300 270" role="img" aria-label="Radardiagramm der konditionellen Fähigkeiten">`;
 for(const lv of[25,50,75,100])s+=`<polygon points="${poly(Array(n).fill(lv))}" fill="none" stroke="var(--line)"/>`;
 for(let i=0;i<n;i++){const[x,y]=pt(i,100);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;}
 s+=`<polygon points="${poly(req)}" fill="none" stroke="var(--tartan)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
 s+=`<polygon points="${poly(start)}" fill="none" stroke="var(--muted)" stroke-width="1.2"/>`;
 s+=`<polygon points="${poly(vals)}" fill="var(--infield)" fill-opacity=".25" stroke="var(--infield)" stroke-width="2"/>`;
 for(let i=0;i<n;i++){const[x,y]=pt(i,120);s+=`<text x="${x}" y="${y+4}" text-anchor="middle" style="fill:var(--ink);font-family:var(--f-display);font-size:13px;font-weight:600">${labels[i]}</text><text x="${x}" y="${y+18}" text-anchor="middle" style="fill:var(--muted);font-family:var(--f-mono);font-size:11px">${Math.round(vals[i])}</text>`;}
 return s+'</svg>';
}

function scalePlan(plan,vol,dI){
 if(vol===1&&dI===0)return plan;
 return plan.map(s0=>{const s=JSON.parse(JSON.stringify(s0)),p=s.p;
  if(s.type==='run'){if(p.reps*p.sets===1)p.dist=Math.max(1000,Math.round(p.dist*vol/100)*100);else p.reps=Math.max(1,Math.round(p.reps*vol));p.pct=clamp(p.pct+dI,50,100);}
  else if(s.type==='kraft'){p.sets=Math.max(1,Math.round(p.sets*vol));p.pct=clamp(p.pct+dI,20,100);}
  else if(s.type==='sprung')p.contacts=Math.max(2,Math.round(p.contacts*vol));
  else if(s.type==='alt'){p.dur=Math.max(10,Math.round(p.dur*vol/5)*5);p.hf=clamp(p.hf+dI,55,95);}
  else p.dur=Math.max(5,Math.round(p.dur*vol/5)*5);
  return s;});
}
// Rechnet den Plan auf einer Kopie des Spielstands ohne Zufall durch (Wiederholung bis maxWeeks bzw. Wettkampf)
function project(plan,maxWeeks){
 const saved=S,{hist,...rest}=S;
 const C=JSON.parse(JSON.stringify(rest));
 C.hist={daily:[],weeks:[],log:[],plans:[]};C.setup=Object.assign({},C.setup,{random:false});C.plan=plan;
 const r={days:[],weeks:[]};
 S=C;
 try{
  const W=S.setup.weeks;
  for(let w=0;w<maxWeeks&&S.week<W;w++){
   const last=S.week===W-1;let pI=1,pS=1;
   for(let i=0;i<(last?6:7);i++){
    const o=simulateDay();
    if(w===0)r.days.push({dow:o.dow,load:o.load,items:o.items.map(it=>({n:it.s.name,t:it.s.type,skip:it.skip,load:it.e?it.e.load:0,fail:!!(it.e&&it.e.fail)})),
     form:formRel(),acwr:S.ATL/Math.max(1,S.CTL),D:S.D,pInj:o.pInj||0,pIll:o.pIll||0,inj:o.inj,ill:o.ill});
    pI*=1-(o.pInj||0);pS*=1-(o.pIll||0);
   }
   r.weeks.push({week:S.week,pred:predict(S.A),form:formRel(),pInj:1-pI,pIll:1-pS,caps:Object.assign({},S.A.c),load:0});
   if(last){r.raceForm=formRel();r.race=predict(S.A)/formFactor(r.raceForm);break;}
   S.week++;
  }
 }finally{S=saved;}
 return r;
}

function weekChartSVG(days){
 const W=720,H=250,l=46,r=46,t=26,b=30,cw=(W-l-r)/7;
 const maxL=Math.max(300,...days.map(d=>d.load))*1.1;
 const fMin=Math.min(-50,...days.map(d=>d.form))-5,fMax=Math.max(30,...days.map(d=>d.form))+5;
 const yL=v=>H-b-v/maxL*(H-t-b),yF=v=>H-b-(v-fMin)/(fMax-fMin)*(H-t-b);
 let s=`<svg viewBox="0 0 ${W} ${H}" class="cchart" role="img" aria-label="Belastung, Form und Risiko der geplanten Woche">`;
 for(const v of niceTicks(0,maxL,4))s+=`<line x1="${l}" x2="${W-r}" y1="${yL(v)}" y2="${yL(v)}" stroke="var(--line)"/><text x="${l-6}" y="${yL(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`;
 s+=`<text x="${l-6}" y="12" text-anchor="end">AU</text><text x="${W-r+6}" y="12">Form</text>`;
 for(const v of niceTicks(fMin,fMax,4))s+=`<text x="${W-r+6}" y="${yF(v)+3.5}">${v>0?'+':''}${Math.round(v)}</text>`;
 days.forEach((d,i)=>{
  const x=l+i*cw;
  if(d.acwr>1.5||d.D>1.5)s+=`<rect x="${x}" y="${t}" width="${cw}" height="${H-t-b}" fill="var(--bad)" fill-opacity=".09"/>`;
  else if(d.acwr>1.3||d.D>1.3)s+=`<rect x="${x}" y="${t}" width="${cw}" height="${H-t-b}" fill="var(--warn)" fill-opacity=".09"/>`;
  let y0=H-b;const bw=cw*0.52;
  for(const it of d.items){if(it.skip||!it.load)continue;const h=it.load/maxL*(H-t-b);y0-=h;s+=`<rect x="${x+(cw-bw)/2}" y="${y0}" width="${bw}" height="${Math.max(0,h-1)}" fill="${TYPES[it.t].c}" rx="2"${it.fail?' stroke="var(--bad)" stroke-dasharray="3 2" stroke-width="1.5"':''}/>`;}
  if(!d.items.some(it=>!it.skip))s+=`<text x="${x+cw/2}" y="${H-b-6}" text-anchor="middle" style="font-style:italic">Ruhe</text>`;
  const rr=3+Math.min(9,Math.sqrt(d.pInj*1000)*1.6);
  s+=`<circle cx="${x+cw/2}" cy="${t-12}" r="${rr}" fill="${d.pInj>0.01?'var(--bad)':d.pInj>0.004?'var(--warn)':'var(--good)'}" fill-opacity=".85"/>`;
  s+=`<text x="${x+cw/2}" y="${H-10}" text-anchor="middle" style="fill:var(--ink);font-family:var(--f-display);font-size:13px;font-weight:600">${DAYS[d.dow]}</text>`;
 });
 s+=`<line x1="${l}" x2="${W-r}" y1="${yF(0)}" y2="${yF(0)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
 s+=`<path d="${days.map((d,i)=>(i?'L':'M')+(l+i*cw+cw/2).toFixed(1)+' '+yF(d.form).toFixed(1)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
 days.forEach((d,i)=>{s+=`<circle cx="${l+i*cw+cw/2}" cy="${yF(d.form)}" r="3.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`;});
 days.forEach((d,i)=>{
  const its=d.items.length?d.items.map(it=>`<div class="tl"><i style="background:${TYPES[it.t].c}"></i>${esc(it.n)}<span>${it.skip?'fällt aus ('+it.skip+')':Math.round(it.load)+' AU'+(it.fail?' · Abbruch':'')}</span></div>`).join(''):'<div class="tl muted">Ruhetag</div>';
  const tip=`<b>${DAYS_L[d.dow]}</b>${its}<div class="tg"><span>Belastung</span><b>${Math.round(d.load)} AU</b><span>Form danach</span><b>${d.form>0?'+':''}${Math.round(d.form)} %</b><span>ACWR</span><b>${fx(d.acwr,2)}</b><span>Gewebebelastung</span><b>${Math.round(d.D*100)} %</b><span>Verletzungsrisiko</span><b>${fx(d.pInj*100,2)} %</b></div>`;
  s+=`<rect class="hov" x="${l+i*cw}" y="0" width="${cw}" height="${H}" fill="var(--ink)" fill-opacity="0"${tipAttr(tip)}/>`;
 });
 return s+'</svg>';
}
function timelineSVG(P,R){
 const W=720,H=250,l=58,r=16,t=16,b=30,Wk=S.setup.weeks,d=DIST[S.setup.distKey].d;
 const hist=S.hist.weeks.map((w,i)=>[i,w.pred]);
 const cur=[S.week,predict(S.A)];
 const proj=[cur].concat(P.weeks.map(w=>[w.week+1,w.pred]));
 const rest=[cur].concat(R.weeks.map(w=>[w.week+1,w.pred]));
 const all=hist.concat(proj,rest).map(p=>p[1]).concat([P.race,S.startPred]);
 let yMin=Math.min(...all),yMax=Math.max(...all);const pad=(yMax-yMin)*0.08||1;yMin-=pad;yMax+=pad;
 const X=x=>l+x/Wk*(W-l-r),Y=v=>t+(v-yMin)/(yMax-yMin)*(H-t-b);
 const path=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
 let s=`<svg viewBox="0 0 ${W} ${H}" class="cchart" role="img" aria-label="Prognose bis zum Wettkampf">`;
 for(const v of niceTicks(yMin,yMax,6))s+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtT(v,d)}</text>`;
 const step=Wk>12?2:1;for(let x=0;x<=Wk;x+=step)s+=`<text x="${X(x)}" y="${H-10}" text-anchor="middle">${x===0?'Start':x===Wk?'WK':'W'+x}</text>`;
 s+=`<rect x="${X(S.week)}" y="${t}" width="${X(Wk)-X(S.week)}" height="${H-t-b}" fill="var(--surface-2)"/>`;
 s+=`<line x1="${l}" x2="${W-r}" y1="${Y(S.startPred)}" y2="${Y(S.startPred)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${W-r-4}" y="${Y(S.startPred)-5}" text-anchor="end">Startprognose</text>`;
 s+=`<path d="${path(rest)}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round"/>`;
 s+=`<path d="${path(proj)}" fill="none" stroke="var(--tartan)" stroke-width="2.4" stroke-dasharray="7 4"/>`;
 s+=`<path d="${path(hist)}" fill="none" stroke="var(--infield)" stroke-width="2.6"/>`;
 hist.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--infield)"/>`;});
 s+=`<circle cx="${X(proj[1]?proj[1][0]:S.week)}" cy="${Y(proj[1]?proj[1][1]:cur[1])}" r="4.5" fill="var(--tartan)"/>`;
 s+=`<path d="M${X(Wk)} ${Y(P.race)-8} l2.4 5.6 6 .5 -4.6 3.9 1.4 5.9 -5.2 -3.1 -5.2 3.1 1.4 -5.9 -4.6 -3.9 6 -.5z" fill="var(--led)" stroke="var(--ink)" stroke-width=".8"/>`;
 for(let x=0;x<=Wk;x++){
  const h=hist.find(p=>p[0]===x),pr=proj.find(p=>p[0]===x),re=rest.find(p=>p[0]===x);
  let tip=`<b>${x===0?'Saisonstart':x===Wk?'Wettkampftag':'nach Woche '+x}</b><div class="tg">`;
  if(h)tip+=`<span>tatsächlich</span><b>${fmtT(h[1],d)}</b>`;
  if(pr&&x>S.week)tip+=`<span>mit diesem Plan</span><b>${fmtT(pr[1],d)}</b>`;
  if(re&&x>S.week)tip+=`<span>ohne Training</span><b>${fmtT(re[1],d)}</b>`;
  if(x===Wk)tip+=`<span>Wettkampf inkl. Form</span><b>${fmtT(P.race,d)}</b>`;
  tip+='</div>';
  const x0=X(Math.max(0,x-0.5)),x1=X(Math.min(Wk,x+0.5));
  s+=`<rect class="hov" x="${x0}" y="0" width="${x1-x0}" height="${H}" fill="var(--ink)" fill-opacity="0"${tipAttr(tip)}/>`;
 }
 return s+'</svg>';
}
function capBarsHTML(caps){
 const req=REQ[S.setup.distKey],A=S.A;
 const ks=CK.slice().sort((a,b)=>(req[b]||0)-(req[a]||0));
 const ds=ks.map(k=>caps[k]-A.c[k]);const mx=Math.max(1,...ds.map(Math.abs));
 return`<div class="cbars">${ks.map((k,i)=>{const dv=ds[i],w=Math.abs(dv)/mx*50,cls=dv>0.05?'up':dv<-0.05?'down':'';
  const tip=`<b>${CAPS[k].n}</b><div>${esc(CAPS[k].d)}</div><div class="tg"><span>heute</span><b>${CAPS[k].u(A.c[k],A)}</b><span>danach</span><b>${CAPS[k].u(caps[k],A)}</b><span>Talentgrenze</span><b>${CAPS[k].u(A.ceil[k],A)}</b></div>`;
  return`<div class="cbar-row"${tipAttr(tip)}><span class="cb-n">${CAPS[k].n}${req[k]?relDots(req[k]):''}</span><span class="cb-t"><i class="${cls}" style="${dv>=0?'left:50%':'right:50%'};width:${w}%"></i><b></b></span><span class="cb-v delta ${cls}">${dv>=0.005?'+':dv<=-0.005?'−':'±'}${fx(Math.abs(dv),2)}</span></div>`;}).join('')}</div>`;
}

/* ---------- Wirkung einer einzelnen Einheit (Editor) ---------- */
let IMP={t:null};
function scheduleImpact(){clearTimeout(IMP.t);IMP.t=setTimeout(renderImpact,120);}
function renderImpact(){
 const box=document.getElementById('impact');if(!box||!ED||S.phase!=='plan')return;
 const others=S.plan.filter(x=>x.id!==ED.s.id);
 if(!ED.base)ED.base=project(others,1);
 const B=ED.base,P=project(others.concat([ED.s]),1),b=B.weeks[0],w=P.weeks[0],d=DIST[S.setup.distKey].d;
 const dLoad=P.days.reduce((a,x)=>a+x.load,0)-B.days.reduce((a,x)=>a+x.load,0);
 const dPred=w.pred-b.pred;
 const top=CK.map(k=>[k,w.caps[k]-b.caps[k]]).filter(x=>Math.abs(x[1])>0.004).sort((a,c)=>Math.abs(c[1])-Math.abs(a[1])).slice(0,4);
 const mx=Math.max(0.05,...top.map(x=>Math.abs(x[1])));
 box.innerHTML=`<div class="eyebrow" style="margin-bottom:6px">Wirkung dieser Einheit auf die Woche</div>
 <div class="pv-row">
  <div class="pv"><div class="k">Prognose</div><div class="v ${dPred<-0.005?'up':dPred>0.005?'down':''}">${Math.abs(dPred)<0.005?'±0':fmtDelta(dPred,d)}</div></div>
  <div class="pv"><div class="k">Form Sonntag</div><div class="v">${Math.round(b.form)} → ${Math.round(w.form)} %</div></div>
  <div class="pv"><div class="k">Wochenbelastung</div><div class="v">+${Math.round(dLoad)} AU</div></div>
  <div class="pv"><div class="k">Verletzungsrisiko</div><div class="v ${w.pInj-b.pInj>0.01?'down':''}">${fx(b.pInj*100,1)} → ${fx(w.pInj*100,1)} %</div></div>
 </div>
 <div class="effect" style="margin-top:8px">${top.length?top.map(([k,v])=>`<span>${CAPS[k].n}</span><span class="dbar"><i class="${v>0?'up':'down'}" style="${v>0?'left:50%':'right:50%'};width:${Math.abs(v)/mx*50}%"></i></span>`).join(''):'<span class="muted">Kaum messbare Wirkung in einer Woche.</span>'}</div>${top.some(x=>x[1]<0)?'<div class="muted" style="font-size:12px;margin-top:6px">Rote Balken: Die zusätzliche Ermüdung bremst die Anpassung anderer Fähigkeiten.</div>':''}`;
}

/* ---------- Tooltip ---------- */
const tipEl=document.createElement('div');tipEl.id='tip';tipEl.hidden=true;document.body.appendChild(tipEl);
let tipFor=null;
function showTip(el,x,y){if(tipFor!==el){tipFor=el;tipEl.innerHTML=el.getAttribute('data-tip');}tipEl.hidden=false;
 const r=tipEl.getBoundingClientRect(),vw=document.documentElement.clientWidth,vh=window.innerHeight;
 let L=x+14,T=y+14;if(L+r.width>vw-8)L=Math.max(8,x-r.width-14);if(T+r.height>vh-8)T=Math.max(8,y-r.height-14);
 tipEl.style.left=L+'px';tipEl.style.top=T+'px';}
function hideTip(){tipEl.hidden=true;tipFor=null;}
document.addEventListener('pointermove',ev=>{const el=ev.target.closest&&ev.target.closest('[data-tip]');if(el)showTip(el,ev.clientX,ev.clientY);else if(tipFor)hideTip();});
document.addEventListener('pointerdown',ev=>{const el=ev.target.closest&&ev.target.closest('[data-tip]');if(el&&ev.pointerType!=='mouse')showTip(el,ev.clientX,ev.clientY);else if(!el)hideTip();});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Drag & Drop im Wochenplan ---------- */
document.addEventListener('dragstart',ev=>{const el=ev.target.closest&&ev.target.closest('[data-drag]');if(!el)return;ev.dataTransfer.setData('text/plain',el.dataset.drag);ev.dataTransfer.effectAllowed='move';el.classList.add('dragging');hideTip();});
document.addEventListener('dragend',ev=>{document.querySelectorAll('.dragging,.drop-over').forEach(e=>e.classList.remove('dragging','drop-over'));});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('[data-drop]');if(!d)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-over').forEach(e=>e!==d&&e.classList.remove('drop-over'));d.classList.add('drop-over');});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('[data-drop]');if(!d)return;ev.preventDefault();const id=ev.dataTransfer.getData('text/plain'),s=S&&S.plan.find(x=>x.id===id);if(!s)return;
 const nd=+d.dataset.drop;if(s.day!==nd){s.day=nd;save();render();}});

/* ---------- Ereignisse ---------- */
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act;
 if(a==='closebg'&&ev.target!==el)return;
 switch(a){
  case'dist':SETUP.distKey=el.dataset.k;if(DIST[SETUP.distKey].hm)SETUP.hm=DIST[SETUP.distKey].hm;renderSetup();break;
  case'setopt':SETUP[el.dataset.f]=el.dataset.v;renderSetup();break;
  case'start':newGame(Object.assign({},SETUP));UI.tab='last';save();render();window.scrollTo(0,0);break;
  case'resume':{const s=load();if(s){S=s;render();}break;}
  case'restart':if(raceAnim)cancelAnimationFrame(raceAnim);modalRoot.innerHTML='';S=null;try{localStorage.removeItem('formkurve-v1');}catch(e){}SETUP.seed=Math.floor(Math.random()*1e6);renderSetup();window.scrollTo(0,0);break;
  case'tab':UI.tab=el.dataset.k;render();break;
  case'tpl':{const ph=document.getElementById('tplsel').value;S.plan=buildTemplate(groupOf(S.setup.distKey),ph,S.setup.level,S.setup.distKey);if(S.week===S.setup.weeks-1)S.plan=S.plan.filter(s=>s.day!==6);save();render();break;}
  case'clear':S.plan=[];save();render();break;
  case'add':openEditor(mkSess('run','ga1',+el.dataset.day),true);break;
  case'edit':{const s=S.plan.find(x=>x.id===el.dataset.id);if(s)openEditor(s,false);break;}
  case'close':case'closebg':modalRoot.innerHTML='';ED=null;break;
  case'etype':{const t=el.dataset.k;if(t!==ED.s.type){const ns=mkSess(t,PRESETS[t][0][0],ED.s.day);ns.id=ED.s.id;ED.s=ns;renderEditor();}break;}
  case'epreset':{const ns=mkSess(ED.s.type,el.dataset.k,ED.s.day);ns.id=ED.s.id;ED.s=ns;renderEditor();break;}
  case'eday':ED.s.day=+el.dataset.d;modalRoot.querySelectorAll('.daypick button').forEach(b=>b.setAttribute('aria-pressed',b===el));modalRoot.querySelector('.modal-h .eyebrow').textContent=(ED.isNew?'Neue Einheit':'Einheit bearbeiten')+' · '+DAYS_L[ED.s.day];break;
  case'esave':{const i=S.plan.findIndex(x=>x.id===ED.s.id);if(i>=0)S.plan[i]=ED.s;else S.plan.push(ED.s);modalRoot.innerHTML='';ED=null;save();render();break;}
  case'edel':S.plan=S.plan.filter(x=>x.id!==ED.s.id);modalRoot.innerHTML='';ED=null;save();render();break;
  case'edup':{const c=JSON.parse(JSON.stringify(ED.s));c.id='s'+Date.now().toString(36)+(uid++);c.day=(c.day+1)%7;if(S.week===S.setup.weeks-1&&c.day===6)c.day=5;S.plan.push(c);modalRoot.innerHTML='';ED=null;save();render();break;}
  case'hz':CQ.hz=el.dataset.k;document.querySelectorAll('[data-act="hz"]').forEach(b=>b.setAttribute('aria-pressed',b===el));scheduleConseq();break;
  case'cqreset':CQ.vol=1;CQ.dI=0;render();break;
  case'cqapply':S.plan=scalePlan(S.plan,CQ.vol,CQ.dI);CQ.vol=1;CQ.dI=0;save();render();break;
  case'sim':{CQ.vol=1;CQ.dI=0;const rep=simulateWeek();UI.tab='last';save();render();showWeekReport(rep);break;}
  case'closereport':modalRoot.innerHTML='';if(S.phase==='race'){openRacePrep();}else{if(S.week===S.setup.weeks-1)S.plan=S.plan.filter(s=>s.day!==6);render();}break;
  case'rpace':RACE.pacing=el.dataset.v;openRacePrep();break;
  case'gun':startRace();break;
  case'skiprace':if(RACE.finish)RACE.finish();break;
  case'toplan':if(raceAnim)cancelAnimationFrame(raceAnim);modalRoot.innerHTML='';UI.tab='pred';render();showDoneBanner();break;
 }
});
function showDoneBanner(){const m=document.querySelector('.grid-main .stack');if(!m||!S.race)return;const dist=DIST[S.setup.distKey];const b=document.createElement('section');b.className='card';b.innerHTML=`<div class="cta-row"><div><div class="eyebrow">Saison beendet</div><h2>Wettkampf: ${fmtT(S.race.time,dist.d)}</h2></div><div style="display:flex;gap:8px"><button class="btn" data-act="showrace">Ergebnis</button><button class="btn btn-primary" data-act="restart">Neue Saison</button></div></div>`;m.prepend(b);const p=m.querySelector('.card:nth-child(2)');if(p)p.hidden=true;}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act="showrace"]');if(el)renderRaceScreen(false);});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(el.dataset.set){const k=el.dataset.set;SETUP[k]=el.type==='checkbox'?el.checked:+el.value;
  if(k==='seed')return;
  if(el.type==='range'){const lab=el.closest('.field').querySelector('label .num');if(lab)lab.textContent=k==='hm'?el.value+' Hm':k==='age'?el.value+' Jahre':el.value+' Wochen';clearTimeout(SETUP._t);SETUP._t=setTimeout(()=>{const id=el.id;renderSetup();const n=document.getElementById(id);if(n)n.focus();},250);}
  else renderSetup();return;}
 if(el.dataset.cq){const k=el.dataset.cq;if(k==='vol'){CQ.vol=+el.value/100;document.getElementById('o-vol').textContent=el.value+' %';}else{CQ.dI=+el.value;document.getElementById('o-int').textContent=(CQ.dI>0?'+':'')+CQ.dI+' %-Pkt.';}
  const sc=CQ.vol!==1||CQ.dI!==0;document.querySelectorAll('[data-act="cqreset"],[data-act="cqapply"]').forEach(b=>b.disabled=!sc);scheduleConseq();return;}
 if(el.dataset.race){RACE[el.dataset.race]=el.type==='checkbox'?el.checked:+el.value;if(el.type==='range'){const lab=el.closest('.field').querySelector('label .num');if(lab)lab.textContent=el.value+' g/h';}return;}
 if(!ED)return;
 if(el.dataset.nr){const k=el.dataset.nr;let v=+el.value;if(ED.s.type==='run'&&k==='dist')v=slToDist(v);ED.s.p[k]=v;const n=document.getElementById('n-'+k);if(n)n.value=v;updateEditor();}
 else if(el.dataset.nn){const k=el.dataset.nn;const v=+el.value;if(!isFinite(v)||el.value==='')return;ED.s.p[k]=v;const r=document.getElementById('r-'+k);if(r)r.value=ED.s.type==='run'&&k==='dist'?distToSl(v):v;updateEditor();}
 else if(el.dataset.ename!==undefined){ED.s.name=el.value||TYPES[ED.s.type].n;}
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.dataset.life){S.life[el.dataset.life]=+el.value;save();render();return;}
 if(!ED)return;
 if(el.dataset.esel){ED.s.p[el.dataset.esel]=el.value;updateEditor();}
 else if(el.dataset.echk){ED.s.p[el.dataset.echk]=el.checked;updateEditor();}
 else if(el.dataset.nn){const k=el.dataset.nn,n=NORMS[ED.s.type].find(x=>x[0]===k);let v=clamp(+el.value||n[3],n[3],n[4]);ED.s.p[k]=v;el.value=v;updateEditor();}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ED){modalRoot.innerHTML='';ED=null;}});
window.addEventListener('resize',()=>{if(S&&S.race&&document.getElementById('race-cv')&&!raceAnim)drawRace(false);});

/* ---------- Start ---------- */
(function boot(){
 const s=load();
 if(s&&s.phase!=='setup'){S=s;if(S.phase==='done'){render();showDoneBanner();}else render();}
 else renderSetup();
})();
</script>
