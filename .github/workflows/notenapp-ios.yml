name: Notenapp – iOS-App bauen und mit Mac-App synchronisieren

on:
  push:
    branches: [claude/cool-galileo-yis581]
    paths: ['notenapp/**', '.github/workflows/notenapp-ios.yml']
  workflow_dispatch:

concurrency:
  group: notenapp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sync:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: notenapp
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notenapp/package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Web-Build (mit CI-Selbsttest)
        run: VITE_SELFTEST=1 npx vite build

      - name: iOS-Projekt aktualisieren
        run: npx cap sync ios

      - name: Neuestes Xcode wählen (Capacitor 8 braucht Xcode 16+)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: iPhone-Simulator starten
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          rt = sorted(k for k in d if 'iOS' in k and any(x['name'].startswith('iPhone') for x in d[k]))[-1]
          print([x['udid'] for x in d[rt] if x['name'].startswith('iPhone')][0])")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: iOS-App bauen (xcodebuild)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40

      - name: App im Simulator installieren
        run: xcrun simctl install "$SIM_UDID" build/dd/Build/Products/Debug-iphonesimulator/App.app

      - name: Playwright (steuert die Mac-App)
        run: npm i --no-save playwright@1.64.1

      - name: Mac-App ⇄ iPhone-App synchronisieren
        timeout-minutes: 12
        run: node ci/ios-sync-e2e.cjs

      - name: Ergebnisse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notenapp-ios-e2e
          path: notenapp/ci-out

  mac-app:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: notenapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notenapp/package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      - name: Mac-App bauen (DMG, Apple Silicon + Intel)
        run: npm run dist:mac
      - name: DMG bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Notenapp-Mac
          path: notenapp/release/*.dmg
          retention-days: 30
